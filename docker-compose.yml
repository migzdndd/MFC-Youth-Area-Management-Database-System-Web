version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfc-youth-management-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - ADMIN_REGISTRATION_CODE=${ADMIN_REGISTRATION_CODE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"import('http').then(h => h.get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)))\""]
      interval: 30s
      timeout: 5s
      retries: 3
