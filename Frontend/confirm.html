<!DOCTYPE html>
<!--
  Account Provisioning and Email Verification Confirmation Page

  What it Does: Simple non IT Terms
  A friendly landing screen that informs users their email address has been verified or
  their account setup has been completed, with an easy button to proceed to the login page.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Account provisioning and confirmation for the MFC Youth Area Management System.">
  <meta name="theme-color" content="#002847">
  <title>Account Provisioning - MFC Youth Area Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="/img/logo-2.png" fetchpriority="high">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&family=Raleway:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="auth-body">
  <main class="auth-page">
    <section class="login-card auth-card">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1>Registration Flow Updated</h1>
        <p>Verification flow has been updated.</p>
      </div>
      <div class="login-form account-provision-info">
        <p class="prototype-note">Member accounts are activated directly using your registered email address.</p>
        <div class="login-buttons"><button class="btn-auth btn-primary" type="button"
            onclick="navigateWithLoader('/register')">View Account Access</button></div>
      </div>
    </section>
  </main>
  <footer class="auth-footer" style="padding: 2rem; text-align: center; margin-top: auto;">
    Powered &amp; designed by <a href="https://migzdndd.github.io/web-portfolio/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: 600; text-decoration: none;">migz.dev</a> &middot; <a href="/changelogs" style="color: inherit; font-weight: 600; text-decoration: none;">System Changelogs</a>
  </footer>
  <script defer src="/js/loader.js"></script>
  <script defer src="/js/auth.js"></script>
</body>

</html>
