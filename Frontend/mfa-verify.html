<!DOCTYPE html>
<!-- MFC Youth Area Management System: Two-Factor Authentication (TOTP) verification -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Two-Factor Authentication verification for MFC Youth Area Management System.">
  <meta name="theme-color" content="#002847">
  <title>Two-Factor Authentication - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="auth-body auth-recovery-body">
  <main class="auth-page auth-page-modern">
    <section class="login-card login-card-modern animate-in" aria-labelledby="mfaTitle" style="max-width: 440px; margin: 0 auto;">
      <div class="login-header auth-recovery-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="mfaTitle" style="font-size: 1.8rem; margin-top: 8px;">Two-Factor Verification</h1>
        <p id="mfaSubtitle">Enter the 6-digit security code generated by your authenticator app.</p>
      </div>

      <div class="verification-badge auth-security-account" style="margin-bottom: 20px;">
        <span>Authenticating</span>
        <strong id="mfaUserEmail">-</strong>
      </div>

      <form class="login-form login-form-modern" id="mfaVerifyForm" novalidate style="background: transparent; border: none; padding: 0; box-shadow: none;">
        <div id="mfaMessage"></div>

        <div class="form-group auth-recovery-field">
          <label for="mfaCode" style="font-weight: 700; font-size: 0.82rem; letter-spacing: 0.04em; text-transform: uppercase; color: #afbdd0;">Security Code</label>
          <div class="login-field" style="justify-content: center; padding: 0.6em 1em; background: rgba(0, 20, 36, 0.4); border: 1px solid rgba(118, 184, 240, 0.2);">
            <input
              class="login-input"
              id="mfaCode"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              placeholder="000000"
              autocomplete="one-time-code"
              required
              autofocus
              style="text-align: center; font-size: 1.85rem; font-weight: 800; letter-spacing: 0.3em; color: #f5faff; font-family: var(--font-mono, monospace);"
            >
          </div>
          <p class="prototype-note" style="margin-top: 8px; font-size: 0.78rem; color: #8fa1ae;">
            Open Google Authenticator, Microsoft Authenticator, or Authy on your mobile device.
          </p>
        </div>

        <div class="login-buttons auth-recovery-actions" style="margin-top: 18px; flex-direction: column; gap: 10px;">
          <button class="btn-auth btn-primary auth-action-primary" id="mfaSubmitBtn" type="submit" style="width: 100%;">
            Verify &amp; Continue
          </button>
          <button class="btn-auth auth-action-secondary" id="mfaCancelBtn" type="button" style="width: 100%; background: transparent; border: 1px solid rgba(255, 255, 255, 0.12); color: #afbdd0;">
            Cancel &amp; Return to Sign In
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer class="auth-footer" style="padding: 2rem; text-align: center; margin-top: auto;">
    Powered &amp; designed by <a href="https://migzdndd.github.io/web-portfolio/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: bold; text-decoration: none;">migz.dev</a>
  </footer>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script src="/js/loader.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (() => {
      const rawPending = sessionStorage.getItem('mfa_pending');
      if (!rawPending) {
        window.location.replace('/');
        return;
      }

      let pendingData = null;
      try {
        pendingData = JSON.parse(rawPending);
      } catch {
        sessionStorage.removeItem('mfa_pending');
        window.location.replace('/');
        return;
      }

      const emailEl = document.getElementById('mfaUserEmail');
      if (emailEl && pendingData.user?.email) {
        emailEl.textContent = pendingData.user.email;
      }

      const form = document.getElementById('mfaVerifyForm');
      const input = document.getElementById('mfaCode');
      const submitBtn = document.getElementById('mfaSubmitBtn');
      const cancelBtn = document.getElementById('mfaCancelBtn');

      cancelBtn.addEventListener('click', () => {
        sessionStorage.removeItem('mfa_pending');
        if (typeof navigateWithLoader === 'function') {
          navigateWithLoader('/');
        } else {
          window.location.href = '/';
        }
      });

      // Auto-submit when 6 digits are reached
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '').slice(0, 6);
        if (input.value.length === 6) {
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = input.value.trim();

        if (code.length !== 6) {
          if (typeof showMessage === 'function') {
            showMessage('mfaMessage', 'Please enter a complete 6-digit code.', 'error');
          }
          input.focus();
          return;
        }

        setButtonBusy(submitBtn, true, 'Verifying…');
        const msgContainer = document.getElementById('mfaMessage');
        if (msgContainer) msgContainer.innerHTML = '';

        try {
          const response = await fetch('/api/mfa/verify', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${pendingData.tempSession?.accessToken || ''}`
            },
            body: JSON.stringify({
              factorId: pendingData.factorId,
              code
            })
          });

          const data = await response.json().catch(() => ({ ok: false, error: 'Invalid response from server.' }));

          if (!response.ok || !data.ok) {
            setButtonBusy(submitBtn, false, 'Verify & Continue');
            const errMsg = data.error || (response.status === 429 ? 'Rate limit exceeded. Please wait a few minutes.' : 'Verification failed.');
            if (typeof showMessage === 'function') {
              showMessage('mfaMessage', errMsg, 'error');
            }
            input.value = '';
            input.focus();
            return;
          }

          sessionStorage.removeItem('mfa_pending');
          const session = backendSessionFromResponse(data, pendingData.remember);

          if (typeof toast === 'function') {
            toast('Two-factor authentication verified.', 'success');
          }

          setTimeout(() => {
            navigateWithLoader(destinationFor(session));
          }, 300);
        } catch (err) {
          setButtonBusy(submitBtn, false, 'Verify & Continue');
          if (typeof showMessage === 'function') {
            showMessage('mfaMessage', err?.message || 'Network error during verification.', 'error');
          }
        }
      });
    })();
  </script>
</body>

</html>
