<!DOCTYPE html>
<!--
  Password Reset Confirmation Form Page

  What it Does: Simple non IT Terms
  The page users land on after clicking the secret recovery link in their email.
  It lets them type and confirm a new password to get back into their account.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your password for the MFC Youth Area Management System.">
  <meta name="theme-color" content="#002847">
  <title>Reset Password - MFC Youth Area Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="/img/logo-2.svg" fetchpriority="high">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&family=Raleway:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/img/logo-2.svg">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="auth-body auth-recovery-body">
  <!-- Main Reset Password Container -->
  <main class="auth-page auth-page-modern">
    <!-- Reset Password Card -->
    <section class="login-card login-card-modern animate-in" aria-labelledby="resetPasswordTitle">
      <div class="login-header auth-recovery-header">
        <img class="logo-mark" src="/img/logo.svg" alt="MFC Youth Logo">
        <h1 id="resetPasswordTitle">Set a New Password</h1>
        <p>Create a new password for your account.</p>
      </div>

      <!-- Reset Password Form -->
      <form class="login-form login-form-modern auth-recovery-form" id="resetPasswordForm" novalidate>
        <div class="form-group auth-recovery-field">
          <label for="newPassword">New Password</label>
          <div class="auth-password-input-wrap">
            <input class="auth-text-input" type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password" placeholder="Enter a new password">
            <button class="auth-inline-toggle" type="button" data-toggle-password="newPassword" aria-label="Show new password">Show</button>
          </div>
          <div class="password-strength-meter" data-for="newPassword" aria-live="polite">
            <div class="strength-track">
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
            </div>
            <div class="strength-meta">
              <span class="strength-label">Strength: <strong class="strength-rating strength-empty">Not entered</strong></span>
            </div>
            <div class="strength-criteria">
              <span class="strength-rule" data-rule="length">8+ characters</span>
              <span class="strength-rule" data-rule="letter">Letters</span>
              <span class="strength-rule" data-rule="number">Numbers</span>
            </div>
          </div>
          <small>Use at least 8 characters with at least one letter and one number.</small>
        </div>

        <div class="form-group auth-recovery-field">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="auth-password-input-wrap">
            <input class="auth-text-input" type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Re-enter your new password">
            <button class="auth-inline-toggle" type="button" data-toggle-password="confirmPassword" aria-label="Show confirmed password">Show</button>
          </div>
          <div class="password-match-indicator" data-match-for="confirmPassword" data-match-with="newPassword" aria-live="polite">
            Must match password
          </div>
        </div>

        <div class="auth-alert auth-alert-error" id="resetPasswordError" role="alert" aria-live="assertive" hidden></div>
        <div class="auth-alert auth-alert-success" id="resetPasswordSuccess" role="status" aria-live="polite" hidden></div>

        <div class="login-buttons auth-recovery-actions">
          <button class="btn-auth btn-primary auth-action-primary" type="submit" id="submitBtn">Save New Password</button>
          <button class="btn-auth auth-action-secondary" type="button" id="backToSignInBtn">Back to Sign In</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="auth-footer" style="padding: 2rem; text-align: center; margin-top: auto;">
    Powered &amp; designed by <a href="https://migzdndd.github.io/web-portfolio/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: 600; text-decoration: none;">migz.dev</a> &middot; <a href="/changelogs" style="color: inherit; font-weight: 600; text-decoration: none;">System Changelogs</a>
  </footer>
  <script defer src="/js/loader.js"></script>
  <script defer src="/js/password-strength.js"></script>
  <script>
    (() => {
      let recoveryToken = '';
      const form = document.getElementById('resetPasswordForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const errorDiv = document.getElementById('resetPasswordError');
      const successDiv = document.getElementById('resetPasswordSuccess');
      const submitBtn = document.getElementById('submitBtn');
      const backBtn = document.getElementById('backToSignInBtn');

      const showError = (message) => {
        successDiv.hidden = true;
        errorDiv.textContent = message;
        errorDiv.hidden = false;
      };

      const hideStatus = () => {
        errorDiv.hidden = true;
        successDiv.hidden = true;
      };

      backBtn.addEventListener('click', () => navigateWithLoader('/'));

      const urlParams = new URLSearchParams(window.location.search);
      recoveryToken = urlParams.get('token_hash') || '';
      if (!recoveryToken && window.location.hash) {
        recoveryToken = new URLSearchParams(window.location.hash.substring(1)).get('token_hash') || '';
      }

      if (recoveryToken) {
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        showError('Invalid or missing recovery token. Please request a new recovery link.');
        submitBtn.disabled = true;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideStatus();

        if (!recoveryToken) {
          showError('Invalid or missing recovery token. Please request a new recovery link.');
          return;
        }

        const newPassword = newPasswordInput.value;
        const confirmation = confirmPasswordInput.value;
        const pError = typeof window.passwordError === 'function'
          ? window.passwordError(newPassword)
          : (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/\d/.test(newPassword)
            ? 'Password must be at least 8 characters and contain at least one letter and one number.'
            : '');
        if (pError) {
          showError(pError);
          newPasswordInput.focus();
          return;
        }
        if (newPassword !== confirmation) {
          showError('The new passwords do not match.');
          confirmPasswordInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';

        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            cache: 'no-store',
            body: JSON.stringify({ token_hash: recoveryToken, newPassword })
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok || !data?.ok) {
            throw new Error(data?.error || 'Failed to reset password.');
          }

          recoveryToken = '';
          form.reset();
          submitBtn.hidden = true;
          successDiv.textContent = data?.message || 'Password reset successfully. You may now sign in with your new password.';
          successDiv.hidden = false;
        } catch (error) {
          showError(error?.message || 'A network error occurred. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save New Password';
        }
      });
    })();
  </script>
</body>

</html>
