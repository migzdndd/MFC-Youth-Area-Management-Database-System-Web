<!DOCTYPE html>
<!--
  Page Not Found (404) Fallback Error Page

  What it Does: Simple non IT Terms
  A friendly helper screen shown whenever someone visits a broken, misspelled, or
  outdated link, giving them a clear button to navigate safely back to the home page.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The requested page was not found in the MFC Youth Area Management System.">
  <meta name="theme-color" content="#002847">
  <title>Page Not Found - MFC Youth Area Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;500;600;700;800;900&family=Raleway:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="auth-body">
  <main class="auth-page">
    <section class="login-card error-card">
      <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
      <p class="error-code">404</p>
      <h1>Page Not Found</h1>
      <p>Page not found or route has changed.</p>
      <div class="login-buttons error-actions">
        <a class="btn-auth btn-primary link-button" href="/dashboard">Go to Dashboard</a>
        <a class="btn-auth btn-dark link-button" href="/">Sign In</a>
      </div>
    </section>
  </main>
  <footer class="auth-footer" style="padding: 2rem; text-align: center; margin-top: auto;">
    Powered &amp; designed by <a href="https://migzdndd.github.io/web-portfolio/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: 600; text-decoration: none;">migz.dev</a> &middot; <a href="/changelogs" style="color: inherit; font-weight: 600; text-decoration: none;">System Changelogs</a>
  </footer>
  <script src="/js/loader.js"></script>
</body>

</html>
