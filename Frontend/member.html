<!DOCTYPE html>
<!--
  Personal Member Portal Dashboard Page

  What it Does: Simple non IT Terms
  The personal home screen for youth community members. Members can see their profile card,
  assigned ministry service, chapter branch, upcoming gatherings, and personal GIG giving history.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002847">
  <meta name="description" content="MFC Youth Member Portal.">
  <title>Member Portal - MFC Youth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;500;600;700;800;900&family=Raleway:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MFC Youth AMS">
  <link rel="apple-touch-icon" href="/img/logo-2.png">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="layout-body member-portal-body">
  <!-- Top Navigation Header -->
  <header class="top-header member-portal-topbar" aria-label="Member portal navigation header">
    <div class="member-portal-brand">
      <img src="/img/logo-2.png" alt="MFC Youth Logo">
      <div>
        <strong class="brand-mfc-youth">MFC YOUTH</strong>
        <span>Member Portal</span>
      </div>
    </div>

    <nav class="member-portal-nav" aria-label="Member portal navigation">
      <a href="#overview">Overview</a>
      <a href="#events">Gatherings</a>
      <a href="#profile">My Profile</a>
    </nav>

    <div class="member-portal-actions">
      <button class="btn blue" id="editProfileNavBtn" type="button">Edit Profile</button>
      <button class="btn" id="changePasswordBtn" type="button">Change Password</button>
      <button class="btn red" id="memberLogoutBtn" type="button" x-data="{ loading: false }" :disabled="loading">
        <span x-show="!loading">Logout</span>
        <span x-show="loading" style="display: none;">Signing Out…</span>
      </button>
    </div>
  </header>

  <!-- Main Portal Content -->
  <main class="main-content member-portal-main member-portal-content" id="memberPortalContent"></main>

  <footer class="auth-footer" style="padding: 2rem; text-align: center; margin-top: auto;">
    Powered &amp; designed by <a href="https://migzdndd.github.io/web-portfolio/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: 600; text-decoration: none;">migz.dev</a> &middot; <a href="/changelogs" style="color: inherit; font-weight: 600; text-decoration: none;">System Changelogs</a>
  </footer>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
  <script src="/js/loader.js"></script>
  <script src="/js/member.js"></script>
</body>

</html>
