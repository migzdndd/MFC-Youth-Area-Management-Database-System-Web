<!DOCTYPE html>
<!--
  Legacy Password Recovery Forwarder Page

  What it Does: Simple non IT Terms
  A smooth redirect helper that forwards anyone clicking old or bookmarked recovery links
  directly to the official new password reset page, keeping all security codes intact.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002847">
  <title>Reset Password - MFC Youth Area Management System</title>
  <script>
    // Forward to canonical reset password page preserving token parameters
    const target = '/reset-password' + (window.location.search || '') + (window.location.hash || '');
    window.location.replace(target);
  </script>
</head>

<body>
  <p>Redirecting to <a href="/reset-password">Reset Password</a>…</p>
</body>

</html>
