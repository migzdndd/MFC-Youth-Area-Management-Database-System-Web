name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'brain/**'
      - 'docs/**'
      - 'scratch/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'brain/**'
      - 'docs/**'
      - 'scratch/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Apply least-privilege permissions globally
permissions:
  contents: read

# Cancel redundant in-progress PR builds, but preserve full runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  code-quality-and-tests:
    name: Code Quality, Contracts & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository (Fast Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify No Committed Environment Secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\..*)' | grep -v '\.env\.example'; then
            echo "Error: Tracked .env secret file detected in repository!"
            exit 1
          fi
          echo "✓ No tracked .env files detected."

      - name: Fast Syntax & Configuration Validation
        run: |
          node --check server.js && node --check Backend/api/router.js
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'));"
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
            const routes = config.routes || config.rewrites;
            if (!Array.isArray(routes)) throw new Error('Missing routes in vercel.json');
            const apiRoute = routes.find(r => (r.src === '/api/(.*)' || r.source === '/api/(.*)'));
            if (!apiRoute) throw new Error('Invalid /api route destination in vercel.json');
            const spaRoute = routes.find(r => (r.src === '/(.*)' || r.source === '/(.*)'));
            if (!spaRoute) throw new Error('Missing catch-all SPA route in vercel.json');
            console.log('✓ Vercel PaaS single-project route configuration verified.');
          "

      - name: Setup Node.js Runtime & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend-react/package-lock.json

      - name: Install Root & Workspace Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Frontend Dependencies
        run: npm --prefix frontend-react ci --prefer-offline --no-audit

      - name: Backend & Contract Parity Tests
        run: node --test tests/frontend-schemas.test.mjs

      - name: Frontend Code Hygiene (Oxlint)
        run: npm --prefix frontend-react run lint

      - name: Build Modern React SPA (TypeScript & Vite)
        run: npm --prefix frontend-react run build

      - name: Standalone API Server Health Test
        run: npm run test:health

  security-audit-and-hygiene:
    name: Secrets & Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository (Full History for Secret Audit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Setup Node.js Runtime & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend-react/package-lock.json

      - name: Strict Dependency Audit (Root & Workspaces)
        run: npm audit --audit-level=high

      - name: Strict Dependency Audit (Frontend React SPA)
        run: npm --prefix frontend-react audit --audit-level=high

  codeql-analysis:
    name: CodeQL Static Security Analysis (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  container-security-and-build:
    name: Container Build, Scan & Smoke Test
    runs-on: ubuntu-latest
    needs: code-quality-and-tests
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container with Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mfc-youth-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Trivy Vulnerability Database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: mfc-youth-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Vulnerability Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-trivy'

      - name: Container Smoke Test
        run: |
          docker run -d --name test-app -p 3000:3000 \
            -e NODE_ENV=production \
            mfc-youth-app:${{ github.sha }}

          for i in {1..20}; do
            if curl -s http://localhost:3000/api/health | grep -q "mfc-youth-web-api"; then
              echo "✓ Container API health test passed."
              if curl -s http://localhost:3000/ | grep -q "root"; then
                echo "✓ Container modern SPA root verification passed."
                docker stop test-app
                docker rm test-app
                exit 0
              fi
            fi
            echo "Waiting for container startup and assets (attempt $i/20)..."
            sleep 1
          done

          echo "Container smoke test failed! Container logs:"
          docker logs test-app
          docker stop test-app
          docker rm test-app
          exit 1