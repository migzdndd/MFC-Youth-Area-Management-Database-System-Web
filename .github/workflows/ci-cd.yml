name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Enforce least-privilege security model
permissions:
  contents: read

# Cancel redundant in-flight builds on rapid commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-security:
    name: Code Quality, Health & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci

      - name: Validate System Configuration Files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('Frontend/manifest.webmanifest', 'utf8'));"

      - name: Verify JavaScript Syntax & Imports
        run: |
          npm run test:syntax
          node --check Frontend/js/api.js
          node --check Frontend/js/app.js
          node --check Frontend/js/auth.js

      - name: Test Standalone API Server Health
        run: npm run test:health

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

  docker-container-verify:
    name: Docker Containerization Build & Integration Test
    runs-on: ubuntu-latest
    needs: code-quality-and-security
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mfc-youth-app:ci-test

      - name: Container Integration & Smoke Test
        run: |
          docker run -d --name test-app -p 3000:3000 mfc-youth-app:ci-test
          sleep 3
          curl -s http://localhost:3000/api/health | grep "mfc-youth-web-api"
          docker stop test-app
          docker rm test-app

  vercel-paas-deployment-check:
    name: PaaS Routing & Deployment Check
    runs-on: ubuntu-latest
    needs: code-quality-and-security
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Vercel Monorepo Rewrites & API Routes
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
            const routes = config.routes || config.rewrites;
            if (!Array.isArray(routes)) throw new Error('Missing routes in vercel.json');
            const apiRoute = routes.find(r => (r.src === '/api/(.*)' || r.source === '/api/(.*)'));
            if (!apiRoute) throw new Error('Invalid /api route destination in vercel.json');
            console.log('✓ Vercel PaaS single-project route configuration verified.');
          "
