name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis-and-security:
    name: Code Hygiene, Secrets & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Configuration Validation
        run: |
          npm run test:syntax
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'));"

      - name: Strict Dependency Audit
        run: npm audit --audit-level=high

      - name: Standalone API Server Health Test
        run: npm run test:health

  container-security-and-build:
    name: Container Build, Scan & Verification
    runs-on: ubuntu-latest
    needs: static-analysis-and-security
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container with Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mfc-youth-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mfc-youth-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Vulnerability Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Container Smoke Test
        run: |
          docker run -d --name test-app -p 3000:3000 \
            -e NODE_ENV=production \
            mfc-youth-app:${{ github.sha }}
          sleep 4
          curl -s --fail http://localhost:3000/api/health || exit 1
          docker stop test-app
          docker rm test-app

  vercel-paas-deployment-check:
    name: PaaS Routing & Deployment Check
    runs-on: ubuntu-latest
    needs: static-analysis-and-security
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Vercel Monorepo Rewrites & API Routes
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
            const routes = config.routes || config.rewrites;
            if (!Array.isArray(routes)) throw new Error('Missing routes in vercel.json');
            const apiRoute = routes.find(r => (r.src === '/api/(.*)' || r.source === '/api/(.*)'));
            if (!apiRoute) throw new Error('Invalid /api route destination in vercel.json');
            console.log('✓ Vercel PaaS single-project route configuration verified.');
          "