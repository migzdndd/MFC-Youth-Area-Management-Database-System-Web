name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: Backend/package.json

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Verify JavaScript & Modules Syntax
        run: |
          node --check server.js
          node --check Backend/api/router.js

      - name: Security Audit (Dependencies)
        run: |
          cd Backend
          npm audit --audit-level=high || true

  container-build:
    name: Docker Containerization Build & Verify
    runs-on: ubuntu-latest
    needs: lint-and-audit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mfc-youth-app:latest

  vercel-deployment-check:
    name: PaaS Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: lint-and-audit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Vercel Configuration
        run: |
          node -e "const config = JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('Vercel rewrites valid:', Array.isArray(config.rewrites));"
